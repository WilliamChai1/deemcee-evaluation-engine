name: Deemcee Video Processor

on:
  repository_dispatch:
    types: [process_video]
  workflow_dispatch:

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: 'release'

      - name: Install Dependencies
        run: pip install requests pillow

      - name: Run Video Processor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEBAPP_URL: ${{ github.event.client_payload.webapp_url || 'https://script.google.com/macros/s/AKfycbyBSi1yBQ1Cvy4cTxNOEa68GsozstpNThb0Ri8bSJA1CpExgkU5cykzbECx43bOd5yC/exec' }}
          STUDENT_NAME: ${{ github.event.client_payload.student_name }}
          THEME: ${{ github.event.client_payload.theme }}
          GRADE_LEVEL: ${{ github.event.client_payload.grade_level }}
          RAW_VIDEO_ID: ${{ github.event.client_payload.raw_video_id }}
          BG_FILE_ID: ${{ github.event.client_payload.bg_file_id }}
          LOGO_FILE_ID: ${{ github.event.client_payload.logo_file_id }}
          INTRO_FILE_ID: ${{ github.event.client_payload.intro_file_id }}
          OUTRO_FILE_ID: ${{ github.event.client_payload.outro_file_id }}
          FINISHED_FOLDER_ID: ${{ github.event.client_payload.finished_folder_id }}
          DRIVE_TOKEN: ${{ github.event.client_payload.drive_token }}
          ROW_NUMBER: ${{ github.event.client_payload.row_number }}
          FILE_NAME: ${{ github.event.client_payload.file_name }}
        run: python process_video.py

      - name: Report Failure to Status Board
        if: failure()
        run: |
          curl -X POST "${{ github.event.client_payload.webapp_url || 'https://script.google.com/macros/s/AKfycbyBSi1yBQ1Cvy4cTxNOEa68GsozstpNThb0Ri8bSJA1CpExgkU5cykzbECx43bOd5yC/exec' }}" \
            -H "Content-Type: text/plain;charset=utf-8" \
            -d "{\"action\":\"process_failed\",\"row_number\":\"${{ github.event.client_payload.row_number }}\",\"error\":\"GitHub Actions runner failed during video processing\"}"
