name: Deemcee Video Processor

on:
  repository_dispatch:
    types: [process_video]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai requests pillow

      - name: Run AI & Video Processor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STUDENT_NAME: ${{ github.event.client_payload.student_name }}
          GRADE_LEVEL: ${{ github.event.client_payload.grade_level }}
          THEME: ${{ github.event.client_payload.theme }}
          FILE_NAME: ${{ github.event.client_payload.file_name }}
          DRIVE_TOKEN: ${{ github.event.client_payload.drive_token }}
          WEB_APP_URL: ${{ github.event.client_payload.web_app_url }}
        run: python process_video.py
